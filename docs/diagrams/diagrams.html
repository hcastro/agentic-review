  .hair { fill: none; stroke: var(--line); stroke-width: 1; }

</style>
</head>

<!-- ───────────────────────── 2. Why it is sized ───────────────────────── -->
<svg data-name="one-in-42" viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" x="0.5" y="0.5" width="1199" height="469" rx="24"/>
  <text class="title" x="48" y="72">42 findings fixed. One affected what shipped.</text>
  <text class="sub" x="48" y="102">One night on a feature that shipped switched off, reviewed with one depth, no blocking rule and no budget.</text>

  <g id="grid42"></g>
  <path class="e thin s-red" d="M262 266 L262 318"/>
  <circle class="f-red" cx="262" cy="318" r="3"/>
  <text class="val f-red" x="274" y="323" style="font-weight:600">1 broke the switched-off state that was deployed</text>
  <text class="body" x="49" y="356">41 were real defects in a state nobody was shipping yet.</text>
  <text class="body" x="49" y="378">8 of the 10 majors were guards with no test, in code that behaved correctly.</text>

  <path class="hair" d="M650 148 L650 392"/>
  <text class="cap" x="690" y="160">WHAT THAT REVIEW COST</text>
  <text class="big end" x="790" y="212">4 h</text><text class="body" x="810" y="208">in the review loop</text>
  <text class="big end" x="790" y="260">2</text><text class="body" x="810" y="256">full reviews</text>
  <text class="big end" x="790" y="308">4</text><text class="body" x="810" y="304">fix rounds, each with a full suite run</text>
  <text class="big end" x="790" y="356">4</text><text class="body" x="810" y="352">fix-checks</text>
  <text class="big end" x="790" y="404">6.3M</text><text class="body" x="810" y="400">subagent tokens</text>

  <text class="small" x="49" y="432">Two rules came out of it. Only a finding that breaks the shipped state blocks, and the default budget is one fix round.</text>
</svg>

<!-- ───────────────────────── 3. Depth ───────────────────────── -->
<svg data-name="depth" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" x="0.5" y="0.5" width="1199" height="639" rx="24"/>
  <text class="title" x="48" y="72">Depth scales with the change.</text>
  <text class="sub" x="48" y="102">Start from the lightest depth that fits. The owner can ask for more at any point.</text>

  <!-- Light -->
  <rect class="f-panel s-line" x="48" y="130" width="356" height="418" rx="18"/>
  <text class="hcard" x="74" y="178">Light</text>
  <rect class="f-blue" x="336" y="162" width="12" height="12" rx="3"/><rect class="f-line" x="352" y="162" width="12" height="12" rx="3"/><rect class="f-line" x="368" y="162" width="12" height="12" rx="3"/>
  <text class="small" x="74" y="206">Docs, tests, small ordinary code,</text>
  <text class="small" x="74" y="225">a change behind an off switch</text>
  <path class="hair" d="M74 244 L378 244"/>
  <text class="cap" x="74" y="270">REVIEW</text>
  <circle class="f-panel s-ink" cx="84" cy="292" r="8.5" stroke-width="2"/><circle class="f-blue" cx="112" cy="292" r="9.5"/><circle class="f-blue" cx="140" cy="292" r="9.5"/>
  <text class="small" x="162" y="297">diff read + 1 or 2 lenses</text>
  <text class="cap" x="74" y="336">REFUTERS</text>
  <text class="val" x="74" y="358">None. You check a major yourself.</text>
  <text class="cap" x="74" y="398">FIX-CHECK</text>
  <text class="val" x="74" y="420">One checker, only when a blocker</text>
  <text class="val" x="74" y="439">or major was fixed</text>
  <text class="cap" x="74" y="478">SUBAGENT TOKENS, TO SCALE</text>
  <rect class="f-line" x="74" y="488" width="304" height="10" rx="5"/><rect class="f-blue" x="74" y="488" width="45.6" height="10" rx="5"/>
  <text class="small" x="74" y="524">about 0.3M · a few minutes</text>

  <!-- Standard -->
  <rect class="f-panel s-line" x="422" y="130" width="356" height="418" rx="18"/>
  <text class="hcard" x="448" y="178">Standard</text>
  <rect class="f-blue" x="710" y="162" width="12" height="12" rx="3"/><rect class="f-blue" x="726" y="162" width="12" height="12" rx="3"/><rect class="f-line" x="742" y="162" width="12" height="12" rx="3"/>
  <text class="small" x="448" y="206">Ordinary features, shared paths,</text>
  <text class="small" x="448" y="225">ships switched on with limited risk</text>
  <path class="hair" d="M448 244 L752 244"/>
  <text class="cap" x="448" y="270">REVIEW</text>
  <circle class="f-blue" cx="458" cy="292" r="9.5"/><circle class="f-blue" cx="486" cy="292" r="9.5"/><circle class="f-blue" cx="514" cy="292" r="9.5"/><circle class="f-blue" cx="542" cy="292" r="9.5"/>
  <text class="small" x="564" y="297">4 lenses</text>
  <text class="cap" x="448" y="336">REFUTERS</text>
  <text class="val" x="448" y="358">Findings that would block</text>
  <text class="cap" x="448" y="398">FIX-CHECK</text>
  <text class="val" x="448" y="420">One checker per 8 fixed items,</text>
  <text class="val" x="448" y="439">a hunter when shared code changed</text>
  <text class="cap" x="448" y="478">SUBAGENT TOKENS, TO SCALE</text>
  <rect class="f-line" x="448" y="488" width="304" height="10" rx="5"/><rect class="f-blue" x="448" y="488" width="152" height="10" rx="5"/>
  <text class="small" x="448" y="524">about 1M · about 10 minutes</text>

  <!-- Full -->
  <rect class="f-panel s-line" x="796" y="130" width="356" height="418" rx="18"/>
  <text class="hcard" x="822" y="178">Full</text>
  <rect class="f-blue" x="1084" y="162" width="12" height="12" rx="3"/><rect class="f-blue" x="1100" y="162" width="12" height="12" rx="3"/><rect class="f-blue" x="1116" y="162" width="12" height="12" rx="3"/>
  <text class="small" x="822" y="206">Security, unattended or public code</text>
  <text class="small" x="822" y="225">that ships switched on, data migrations</text>
  <path class="hair" d="M822 244 L1126 244"/>
  <text class="cap" x="822" y="270">REVIEW</text>
  <circle class="f-blue" cx="832" cy="292" r="9.5"/><circle class="f-blue" cx="860" cy="292" r="9.5"/><circle class="f-blue" cx="888" cy="292" r="9.5"/><circle class="f-blue" cx="916" cy="292" r="9.5"/>
  <circle class="s-blue dash" cx="944" cy="292" r="8.5" fill="none" stroke-width="1.8" style="stroke-dasharray:3 3.4"/><circle class="s-blue" cx="972" cy="292" r="8.5" fill="none" stroke-width="1.8" style="stroke-dasharray:3 3.4"/>
  <text class="small" x="994" y="297">4 lenses + up to 2</text>
  <text class="cap" x="822" y="336">REFUTERS</text>
  <text class="val" x="822" y="358">Every finding that needs one</text>
  <text class="cap" x="822" y="398">FIX-CHECK</text>
  <text class="val" x="822" y="420">At least two checkers,</text>
  <text class="val" x="822" y="439">plus a regression hunter</text>
  <text class="cap" x="822" y="478">SUBAGENT TOKENS, TO SCALE</text>
  <rect class="f-blue" x="822" y="488" width="304" height="10" rx="5"/>
  <text class="small" x="822" y="524">about 2M · 20 to 30 minutes</text>

  <path class="e thin s-ink" d="M56 592 L56 578" marker-end="url(#arr)"/>
  <text class="body" x="74" y="590">One level up for each: authorization, delivery, stored data or money · runs unattended · over about 600 changed lines</text>
  <path class="e thin s-ink" d="M56 602 L56 616" marker-end="url(#arr)"/>
  <text class="body" x="74" y="614">Usually one level down: a feature that ships switched off is reviewed for the switched-off state</text>
</svg>

<!-- ───────────────────────── 4. Triage ───────────────────────── -->
<svg data-name="triage" viewBox="0 0 1200 530" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" x="0.5" y="0.5" width="1199" height="529" rx="24"/>
  <text class="title" x="48" y="72">Only what breaks the shipped state blocks a release.</text>
  <text class="sub" x="48" y="102">Three questions decide where a finding goes. Everything confirmed keeps its evidence.</text>

  <path class="e s-ink" d="M78 250 L271 250" marker-end="url(#arr)"/>
  <path class="e s-ink" d="M322 250 L531 250" marker-end="url(#arr)"/>
  <path class="e s-ink" d="M582 250 L791 250" marker-end="url(#arr)"/>
  <path class="e s-red" d="M842 250 L973 250" marker-end="url(#arr)"/>

  <path class="e thin s-ink3" d="M560 272 L560 333" marker-end="url(#arr)"/>
  <path class="e thin s-amber" d="M820 272 L820 333" marker-end="url(#arr)"/>
  <text class="cap mid" x="427" y="238">YES</text><text class="cap mid" x="687" y="238">YES</text><text class="cap mid f-red" x="908" y="238">YES</text>
  <text class="cap" x="311" y="308">NO</text><text class="cap" x="571" y="308">NO</text><text class="cap f-amber" x="831" y="308">NO</text>

  <circle class="f-ink" cx="70" cy="250" r="8"/>
  <text class="name" x="48" y="218">A proposed finding</text>
  <path class="node f-panel s-ink" d="M278 250 L300 228 L322 250 L300 272 Z" stroke-linejoin="round"/>
  <path class="node f-panel s-ink" d="M538 250 L560 228 L582 250 L560 272 Z" stroke-linejoin="round"/>
  <path class="node f-panel s-ink" d="M798 250 L820 228 L842 250 L820 272 Z" stroke-linejoin="round"/>
  <text class="name mid" x="300" y="184">Does it survive</text><text class="name mid" x="300" y="204">a refuter?</text>
  <text class="name mid" x="560" y="184">Did this change</text><text class="name mid" x="560" y="204">introduce it?</text>
  <text class="name mid" x="820" y="184">Does it break the</text><text class="name mid" x="820" y="204">state that ships?</text>

  <rect class="f-panel s-line2" x="190" y="340" width="220" height="94" rx="14"/>
  <text class="hcard" x="212" y="376" style="font-size:21px">Refuted</text>
  <text class="small" x="212" y="400">One line in the report.</text><text class="small" x="212" y="418">Nothing to fix.</text>
  <rect class="f-panel s-line2" x="450" y="340" width="220" height="94" rx="14"/>
  <text class="hcard" x="472" y="376" style="font-size:21px">Backlog</text>
  <text class="small" x="472" y="400">The base behaves the same.</text><text class="small" x="472" y="418">Shown to the owner.</text>

  <text class="hcard f-amber" x="732" y="376" style="font-size:21px">Deferred</text>
  <text class="small" x="732" y="400">Goes on the follow-up list,</text><text class="small" x="732" y="418">with when to do it.</text>

  <text class="body" x="48" y="480">Severity and blocking are separate questions. A major in a state that is not shipping is deferred.</text>
  <text class="body" x="48" y="502">A minor that corrupts data in the shipped state blocks.</text>

<!-- ───────────────────────── 5. Independence ───────────────────────── -->
<svg data-name="independence" viewBox="0 0 1200 510" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" x="0.5" y="0.5" width="1199" height="509" rx="24"/>
  <text class="title" x="48" y="72">Fresh eyes, on purpose.</text>
  <text class="sub" x="48" y="102">Every reviewer is a new subagent. Each gets what its job needs and nothing that would bias it.</text>

  <g class="name mid" style="font-size:13.5px">
    <text x="400" y="152">Frozen</text><text x="400" y="170">snapshot</text>
    <text x="537" y="152">Purpose and</text><text x="537" y="170">invariants</text>
    <text x="674" y="152">The finding</text><text x="674" y="170">under test</text>
    <text x="811" y="152">Other reviewers'</text><text x="811" y="170">output</text>
    <text x="948" y="152">Implementer's</text><text x="948" y="170">report</text>
    <text x="1085" y="152">Build story,</text><text x="1085" y="170">PR text</text>
  </g>
  <path class="hair" d="M48 190 L1152 190" style="stroke:var(--line2)"/>
  <path class="hair" d="M48 276 L1152 276"/><path class="hair" d="M48 362 L1152 362"/>

  <text class="name" x="48" y="230">Lens reviewer</text><text class="cap" x="48" y="248">ONE PER LENS</text>
  <text class="name" x="48" y="316">Refuter</text><text class="cap" x="48" y="334">ONE PER FINDING</text>
  <text class="name" x="48" y="402">Fix-checker</text><text class="cap" x="48" y="420">ONE PER 8 FIXED ITEMS</text>

  <!-- row 1 -->
  <circle class="f-blue" cx="400" cy="230" r="11"/><circle class="f-blue" cx="537" cy="230" r="11"/>
  <path class="e s-ink3" d="M666 230 L682 230"/>
  <circle class="s-line2" cx="811" cy="230" r="10" fill="none" stroke-width="2"/><circle class="s-line2" cx="948" cy="230" r="10" fill="none" stroke-width="2"/><circle class="s-line2" cx="1085" cy="230" r="10" fill="none" stroke-width="2"/>
  <!-- row 2 -->
  <circle class="f-blue" cx="400" cy="316" r="11"/><circle class="f-blue" cx="537" cy="316" r="11"/><circle class="f-blue" cx="674" cy="310" r="11"/>
  <text class="cap mid" x="674" y="340">THE CLAIM ONLY</text>
  <circle class="s-line2" cx="811" cy="316" r="10" fill="none" stroke-width="2"/><circle class="s-line2" cx="948" cy="316" r="10" fill="none" stroke-width="2"/><circle class="s-line2" cx="1085" cy="316" r="10" fill="none" stroke-width="2"/>
  <!-- row 3 -->
  <circle class="f-blue" cx="400" cy="396" r="11"/><text class="cap mid" x="400" y="426">PLUS THE DELTA</text>
  <circle class="f-blue" cx="537" cy="402" r="11"/><circle class="f-blue" cx="674" cy="396" r="11"/><text class="cap mid" x="674" y="426">ITS ITEMS</text>
  <circle class="s-line2" cx="811" cy="402" r="10" fill="none" stroke-width="2"/>
  <circle class="f-amber" cx="948" cy="396" r="11"/><text class="cap mid f-amber" x="948" y="426">DO NOT TRUST IT</text>
  <circle class="s-line2" cx="1085" cy="402" r="10" fill="none" stroke-width="2"/>

  <path class="hair" d="M48 448 L1152 448" style="stroke:var(--line2)"/>
  <g transform="translate(48 482)">
    <circle class="f-blue" cx="8" cy="-4" r="7.5"/><text class="small" x="24" y="0">Sees it</text>
    <circle class="s-line2" cx="110" cy="-4" r="7" fill="none" stroke-width="2"/><text class="small" x="126" y="0">Never sees it</text>
    <circle class="f-amber" cx="250" cy="-4" r="7.5"/><text class="small" x="266" y="0">Sees it, with the instruction to attack its claims first</text>
  </g>
</svg>

<script>
  // 42 dots: 14 columns by 3 rows. The one highlighted dot is the finding that affected the shipped state.
  const g = document.getElementById('grid42'), ns = 'http://www.w3.org/2000/svg';
  for (let r = 0; r < 3; r++) for (let c = 0; c < 14; c++) {
    const d = document.createElementNS(ns, 'circle');
    d.setAttribute('cx', 62 + c * 40); d.setAttribute('cy', 170 + r * 40); d.setAttribute('r', 13);
    const hit = r === 2 && c === 5;
    d.setAttribute('class', hit ? 'f-red' : 'f-line');
    g.appendChild(d);
  }
</script>
</body>
</html>
